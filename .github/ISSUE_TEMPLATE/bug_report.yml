name: 识别或换题问题
description: 提供已脱敏的复现信息
body:
  - type: markdown
    attributes:
      value: 请勿上传密钥、账号、聊天内容、整个data目录或完整桌面截图。截图仅保留需要检查的题目区域。
  - type: input
    id: version
    attributes:
      label: 程序版本与 Windows 版本
    validations:
      required: true
  - type: input
    id: mirror
    attributes:
      label: 手机型号与投屏软件
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤和实际结果
      description: 预览是否正确？题型、前缀、长度读到了什么？是否在输入、遮挡或换题时发生？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与脱敏题目截图
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 已移除 API 密钥、账号及无关私人内容。
          required: true
